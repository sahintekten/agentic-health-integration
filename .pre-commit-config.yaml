default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # seed files are generated and keep their messy formatting on purpose
      - id: trailing-whitespace
        exclude: &seed_files ^mock-systems/[^/]+/(data|init)/
      - id: end-of-file-fixer
        exclude: *seed_files
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: commit-msg-attribution
        name: commit message has no tool attribution
        language: pygrep
        entry: "(?i)(co-authored-by|claude|anthropic|generated with|ai-generated)"
        stages: [commit-msg]
