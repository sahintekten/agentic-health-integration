name: agentic-health

services:
  patient-registry-api:
    build: ./mock-systems/patient-registry-api
    ports:
      - "8001:8001"
    volumes:
      - ./mock-systems/patient-registry-api/data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  lab-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labdb
      POSTGRES_USER: ${LAB_DB_USER:-labuser}
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-labpass}
    ports:
      - "5433:5432"
    volumes:
      - ./mock-systems/lab-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # the init scripts run on a socket-only server, so TCP is only ready after seeding
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 24

  adt-feed:
    build: ./mock-systems/adt-feed
    ports:
      - "2575:2575"
    environment:
      ADT_TARGET: ${ADT_TARGET:-127.0.0.1:2575}
    volumes:
      - ./mock-systems/adt-feed/data:/app/data:ro
      - ./mock-systems/adt-feed/outbox:/app/outbox
      - ./mock-systems/adt-feed/inbox:/app/inbox
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 2575), 3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12

  # generated FHIR adapters (phase 3): docker compose --profile adapters up
  adapter-a:
    profiles: [adapters]
    build: ./generated/a
    ports:
      - "9001:8080"
    environment:
      REGISTRY_URL: http://patient-registry-api:8001
    depends_on:
      patient-registry-api:
        condition: service_healthy

  adapter-b:
    profiles: [adapters]
    build: ./generated/b
    ports:
      - "9002:8080"
    environment:
      LAB_DB_HOST: lab-db
      LAB_DB_PORT: "5432"
      LAB_DB_USER: ${LAB_DB_USER:-labuser}
      LAB_DB_PASSWORD: ${LAB_DB_PASSWORD:-labpass}
    depends_on:
      lab-db:
        condition: service_healthy

  adapter-c:
    profiles: [adapters]
    build: ./generated/c
    ports:
      - "9003:8080"
      - "2576:2576"
    environment:
      ADT_OUTBOX: /data/outbox
      MLLP_PORT: "2576"
    volumes:
      - ./mock-systems/adt-feed/outbox:/data/outbox:ro
    depends_on:
      adt-feed:
        condition: service_healthy

  adapter-d:
    profiles: [demo]
    build: ./generated/d
    ports:
      - "9004:8080"
    environment:
      EXPORT_DIR: /data/export
    volumes:
      - ./mock-systems/appointments-export/out:/data/export:ro

  # single FHIR entry point over the adapters (phase 4)
  gateway:
    profiles: [adapters]
    build: ./gateway
    ports:
      - "9000:8080"
    environment:
      ADAPTERS_FILE: /config/adapters.json
      INDEX_DB: /data/index.db
      RECON_DIR: /workspace
    volumes:
      - ./gateway/adapters.json:/config/adapters.json:ro
      - gateway-data:/data
      - ./workspace:/workspace:ro
    depends_on:
      - adapter-a
      - adapter-b
      - adapter-c

volumes:
  gateway-data:
